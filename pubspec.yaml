name: token_taker
description: "A new Flutter project."

version: 1.0.0+2

environment:
  sdk: ^3.7.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  image: ^4.9.2
  path_provider: ^2.1.5
  gal: ^2.3.3
  shared_preferences: ^2.5.3
  share_plus: ^12.0.2
  photo_view: ^0.15.0
  http: ^1.6.0
  package_info_plus: ^9.0.1
  open_filex: ^5.0.0
  url_launcher: ^6.3.2
  google_mlkit_text_recognition: ^0.15.0
  image_picker: ^1.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/my_qr.png

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/app_icon.png"
  adaptive_icon_background: "#000000"
  adaptive_icon_foreground: "assets/app_icon.png"
